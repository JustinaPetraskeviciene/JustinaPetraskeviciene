<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Justina Petraškevičienė</title>
<meta name="description" content="Justina Petraškevičienė – autorė. Tekstai apie žmones, keliones, knygas, sportą ir psichologiją.">
<meta property="og:title" content="Justina Petraškevičienė">
<meta property="og:description" content="Justina Petraškevičienė – autorė. Tekstai apie žmones, keliones, knygas, sportą ir psichologiją.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

/* Layout: airy light page; soft colour band hero with portrait circle; articles as gentle cards in a two-column grid with an in-page reader; contact as a tinted panel; owner-only edit bar */
:root{
  --bg:#FFFFFF; --soft:#F3F7F4; --blush:#FBEFF2; --ink:#22292A; --muted:#667170; --line:#E3E8E5;
  --accent:#B24A6C; --sage:#6F9A88; --card:#FFFFFF; --edit:#E9A23B;
  --shadow:0 1px 2px rgba(34,41,42,.04), 0 8px 24px rgba(34,41,42,.06);
  color-scheme:light;
  --display:"Cormorant Garamond", "Garamond", "Times New Roman", serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{transition:none!important}}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16.5px; line-height:1.7}
.in{max-width:1040px; margin:0 auto; padding-left:max(20px, env(safe-area-inset-left, 0px)); padding-right:max(20px, env(safe-area-inset-right, 0px))}
a{color:inherit}
a:focus-visible, button:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px}

body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--soft)}
header{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:color-mix(in srgb, var(--soft) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.nav{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-block:16px}
.mark{font-family:var(--display); font-size:1.5rem; font-weight:600; text-decoration:none}
.mark i{color:var(--accent)}
.nav ul{list-style:none; display:flex; gap:6px; margin:0; padding:0; flex-wrap:wrap}
.nav ul a{text-decoration:none; font-size:.86rem; font-weight:500; color:var(--muted); padding:7px 14px; border-radius:999px; transition:background .2s, color .2s}
.nav ul a:hover{background:var(--card); color:var(--ink)}

.hero-band{background:var(--soft); position:relative; overflow:hidden}
.hero-band::after{content:""; position:absolute; right:-120px; top:-140px; width:420px; height:420px; border-radius:50%; background:var(--blush); opacity:.9; pointer-events:none}
.hero{position:relative; z-index:1; display:grid; grid-template-columns:1.5fr 1fr; gap:48px; align-items:center; padding-block:72px 88px}
.hero > *{min-width:0}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--sage); margin:0 0 18px}
.eyebrow::before{content:""; width:28px; height:1.5px; background:var(--sage); flex:none}
h1{font-family:var(--display); font-weight:500; font-size:clamp(2.7rem, 6.4vw, 4.6rem); line-height:1.04; margin:0 0 22px; text-wrap:balance}
h1 em{font-style:italic; color:var(--accent)}
.lede{font-size:1.12rem; color:var(--muted); max-width:32em; margin:0 0 30px}
.cta{display:flex; gap:12px; flex-wrap:wrap}
.btn{display:inline-block; text-decoration:none; font:inherit; font-weight:600; font-size:.92rem; padding:12px 24px; border-radius:999px; border:0; cursor:pointer; transition:transform .2s, box-shadow .2s, background .2s}
.btn.primary{background:var(--accent); color:#fff}
.btn.primary:hover{transform:translateY(-2px); box-shadow:0 8px 20px color-mix(in srgb, var(--accent) 30%, transparent)}
.btn.ghost{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
.btn.ghost:hover{transform:translateY(-2px)}
.portrait{width:100%; aspect-ratio:1; max-width:100%; border-radius:50%; position:relative;
  background:linear-gradient(145deg, var(--blush), var(--card)); box-shadow:var(--shadow);
  display:grid; place-items:center; text-align:center; border:8px solid var(--card)}
.portrait .ini{font-family:var(--display); font-size:4.4rem; font-style:italic; color:var(--accent); line-height:1}
.portrait small{display:block; font-size:.74rem; color:var(--muted); margin-top:8px; letter-spacing:.06em}
.portrait::after{content:""; position:absolute; width:64px; height:64px; border-radius:50%; background:var(--sage); opacity:.35; left:-6px; bottom:18px}
.portrait img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%}
.photo-wrap{justify-self:center; display:grid; gap:14px; justify-items:center; width:min(300px, 100%)}
.photo-tools{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center}
.photo-tools label, .photo-tools button{font:inherit; font-size:.82rem; font-weight:600; cursor:pointer; border-radius:999px; padding:7px 14px; border:1.5px dashed var(--edit); background:var(--card); color:var(--ink)}
.photo-tools label:focus-within{outline:2px solid var(--accent); outline-offset:3px}
.photo-tools input{position:absolute; width:1px; height:1px; opacity:0}
.photo-tools .pmsg{flex-basis:100%; text-align:center; font-size:.8rem; color:var(--muted)}

section{padding-block:88px; scroll-margin-top:60px}
.sec-head{display:flex; align-items:end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:36px}
.kicker{font-size:.76rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--sage); margin:0 0 6px}
h2{font-family:var(--display); font-weight:500; font-size:clamp(2.1rem, 4.4vw, 2.9rem); line-height:1.08; margin:0; text-wrap:balance}

.about{display:grid; grid-template-columns:1.3fr 1fr; gap:56px; align-items:start}
.about > *{min-width:0}
.about p{margin:0 0 1.1em; max-width:36em}
.about .lead{font-family:var(--display); font-size:1.5rem; line-height:1.4}
.chips{display:grid; gap:14px}
.chip{display:flex; gap:16px; align-items:center; background:var(--soft); border-radius:18px; padding:16px 20px}
.chip > div:last-child{min-width:0; flex:1}
.chip .dot{flex:none; width:42px; height:42px; border-radius:50%; background:var(--card); display:grid; place-items:center; color:var(--accent)}
.chip .dot svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.chip b{display:block; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600}
.chip span{font-weight:500; display:block}

.art-band{background:var(--soft)}
.filters{display:flex; gap:8px; flex-wrap:wrap}
.filters button{font:inherit; font-size:.85rem; font-weight:500; cursor:pointer; background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:7px 16px; transition:all .2s}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
.articles{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:20px}
.article{display:flex; flex-direction:column; gap:10px; height:100%; text-decoration:none; background:var(--card); border-radius:20px; padding:26px 28px; box-shadow:var(--shadow); transition:transform .25s, box-shadow .25s}
a.article:hover{transform:translateY(-4px); box-shadow:0 14px 34px rgba(34,41,42,.10)}
.meta{display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums}
.tag{font-size:.7rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:4px 10px; border-radius:999px; background:var(--blush); color:var(--accent)}
.tag.s{background:var(--soft); color:var(--sage)}
.article h3{font-family:var(--display); font-weight:600; font-size:1.55rem; line-height:1.2; margin:4px 0 0; text-wrap:balance}
.article p{margin:0; color:var(--muted)}
.more{margin-top:auto; padding-top:6px; font-size:.86rem; font-weight:600; color:var(--accent); background:none; border:0; padding-left:0; font-family:inherit; cursor:pointer; text-align:left; text-decoration:none}
.note{font-size:.84rem; color:var(--muted); margin:24px 0 0; font-style:italic}
.empty{background:var(--card); border-radius:20px; padding:28px; color:var(--muted); grid-column:1/-1}

.reader{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:clamp(24px, 5vw, 56px); max-width:760px}
.back{font:inherit; font-size:.88rem; font-weight:600; color:var(--accent); background:none; border:0; cursor:pointer; padding:0; margin-bottom:24px; text-decoration:none; display:inline-block}
.reader h2{margin:12px 0 18px}
.reader .summary{font-family:var(--display); font-size:1.4rem; line-height:1.45; color:var(--muted); margin:0 0 28px}
.reader .body p{margin:0 0 1.2em; max-width:38em}
.reader .body h3{font-family:var(--display); font-weight:600; font-size:1.6rem; line-height:1.25; margin:1.6em 0 .6em; color:var(--accent); text-wrap:balance}
.reader .body h4{font-family:var(--body); font-weight:700; font-size:1.05rem; margin:1.4em 0 .4em; color:var(--ink)}
.reader .body ul{margin:0 0 1.4em; padding-left:1.2em; max-width:38em; display:grid; gap:.6em}
.reader .body li::marker{color:var(--accent)}
.reader .src{margin:28px 0 0; padding-top:18px; border-top:1px solid var(--line); font-size:.9rem; color:var(--muted)}
.reader .src a{color:var(--accent); font-weight:600; text-decoration:none}
.reader textarea{width:100%; min-height:340px; font:inherit; line-height:1.7; color:var(--ink); background:var(--soft); border:1.5px dashed var(--edit); border-radius:12px; padding:16px; resize:vertical}

.contact{background:var(--blush); border-radius:28px; padding:clamp(28px, 5vw, 56px); display:grid; grid-template-columns:1fr 1fr; gap:40px}
.contact > *{min-width:0}
.contact p{margin:0 0 1em; max-width:28em}
.contact .soft{color:var(--muted)}
.links{list-style:none; margin:0; padding:0; display:grid; gap:12px}
.links li{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; background:var(--card); border-radius:14px; padding:14px 18px}
.links li > div{min-width:0; flex:1}
.links .k{display:block; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600}
.links .v{font-weight:500; overflow-wrap:anywhere; display:block}
.copy{font:inherit; font-size:.78rem; font-weight:600; cursor:pointer; background:var(--blush); color:var(--accent); border:0; border-radius:999px; padding:6px 14px}
.copy:hover{background:var(--accent); color:#fff}

footer .in{padding-block:36px 110px; font-size:.84rem; color:var(--muted); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}
footer a{text-decoration:none}

/* Edit mode */
.editing [data-k]{outline:1.5px dashed var(--edit); outline-offset:4px; border-radius:4px; cursor:text; min-width:2ch; min-height:1em}
.editing [data-k]:focus{outline-style:solid; background:color-mix(in srgb, var(--edit) 10%, transparent)}
.editing [data-k="aboutText"]{white-space:pre-wrap}
.editing [data-k]:empty::before{content:attr(data-ph); color:var(--muted); opacity:.7}
.editing .reader textarea[data-k]{outline:none}
.tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding-top:10px; border-top:1px dashed var(--line); margin-top:auto}
.tools select{font:inherit; font-size:.82rem; padding:5px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink)}
.tools button, .add{font:inherit; font-size:.82rem; font-weight:600; cursor:pointer; border-radius:999px; padding:6px 14px; border:1px solid var(--line); background:var(--card); color:var(--ink)}
.tools .del{color:var(--accent)}
.add{border:1.5px dashed var(--edit); background:transparent; padding:18px; border-radius:20px; font-size:.95rem; min-height:120px}
.editbar{position:fixed; z-index:20; right:max(20px, env(safe-area-inset-right, 0px)); bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; background:var(--card); box-shadow:0 10px 30px rgba(0,0,0,.16); border-radius:999px; padding:8px; max-width:calc(100vw - 40px)}
.editbar .msg{font-size:.82rem; color:var(--muted); padding:0 8px}
.editbar .btn{padding:10px 20px; font-size:.88rem}
.editbar .btn.ghost{box-shadow:none; border:1px solid var(--line)}
.editbar .btn[disabled]{opacity:.6; cursor:default; transform:none}

@media (max-width:760px){
  .hero{grid-template-columns:1fr; padding-block:48px 64px; gap:36px}
  .photo-wrap{width:200px; order:-1; justify-self:start}
  .portrait .ini{font-size:3rem}
  section{padding-block:60px}
  .about, .contact{grid-template-columns:1fr; gap:28px}
  .articles{grid-template-columns:1fr}
  .nav ul a{padding:6px 10px}
  .editbar{left:max(20px, env(safe-area-inset-left, 0px)); border-radius:20px; justify-content:center}
}

</style>
</head>

<script type="application/json" id="site-data">{"name": "Justina Petraškevičienė", "initials": "JP", "eyebrow": "AUTORĖ", "headline": "Rašau apie žmones, keliones, knygas, sportą...", "headlineAccent": "", "lede": "Kasdien dirbu su žmonėmis , o laisvalaikiu rašau, skaitau, keliauju ir sportuoju. Čia renku savo tekstus ir mintis.", "aboutLead": "Mano darbas yra žmonės: padėti jiems augti ir kurti komandą, kurioje gera dirbti.", "aboutText": "Rašymas man padeda susidėlioti mintis, o skaitymas ir kelionės atveria naujas džiaugsmo erdves.", "facts": [{"label": "DARBAS", "value": "Personalo vadovė sporto mokykloje"}, {"label": "ŠEIMA", "value": "Dviejų sūnų mama"}, {"label": "POMĖGIAI", "value": "Knygos, rašymas, kelionės, sportas"}], "articlesNote": "", "articles": [{"id": 7, "tag": "Psichologija", "meta": "Moteris.lt · 4 min.", "title": "Šie ženklai rodo – TAS vyras jumis domisi!", "summary": "Kaip suprasti, ar simpatiškas vyras jumis domisi? Trys ženklai, kuriuos išduoda jo žvilgsnis, prisilietimai ir elgesys socialiniuose tinkluose.", "body": "Kurį laiką iš galvos neišeina simpatiškas vyras... Svarstote, tik pasirodė, ar jis taip pat jumis domisi. Kaip išsiaiškinti? Pasitelkus tam tikras psichologų bei kitų specialistų įžvalgas, visai nesunku atspėti, kad priešingos lyties atstovas jums neabejingas. Jei aiškiai pastebite šiuos 3 ženklus, atsakymas – taip!\n\n1. Jūs – saldainis jo akims\n\nGal frazė „akys – žmogaus sielos veidrodis“ skamba banaliai, bet tai gryniausia tiesa. Žvilgsnis yra vienas akivaizdžiausių žmogaus jausmų indikatorių. Šiek tiek mokslininkų įžvalgų tam, kad tuo patikėtumėte. Niekam ne naujiena, jog aistros akimirką vyzdžiai tampa pastebimai didesni. O atlikus naujus tyrimus taip pat paaiškėjo, jog pakanka vos pamatyti patrauklų asmenį, kad akys išduotų jausmus.\n\nKai akiratyje netikėtai pasirodo dominantis objektas, nevalingai pakyla interesanto antakiai ir šiek tiek išsiplečia jo akių vyzdžiai. Taip nutinka dėl staiga organizme plūstelėjusių vadinamųjų „meilės hormonų“ – oksitocino bei dopamino. Jei susižavėjimo objektas taip pat susidomi – jis atsako tuo pačiu. Ši žmonių mimika yra nežymi ir trunka vos dalį sekundės.\n\nAr įmanoma ją pastebėti? Veikiausiai nespėsime patinkančio asmens veide įžvelgti nei antakių kilstelėjimo, juolab užfiksuoti vyzdžių padidėjimo. Tačiau labai gali būti, kad susitikus žvilgsniams pajusime reikšmingą akių kontaktą... Tai – dažnai įsimylėjėlių minimas „veriantis žvilgsnis“, „akių blyksnis“, „ypatingas žvilgsnis“, „žiburėliai akyse“ ir panašūs apibūdinimai.\n\nTodėl, taip – jei patinkantis objektas gaudo jūsų žvilgsnį, jums prasilenkiant koridoriuje akys susitinka, akių kontaktą išlaikote šiek tiek ilgiau nei įprasta ir žvilgsnis tarsi maloniai sukausto, – veikiausiai esate jo fantazijų objektas, kaip ir jis jūsų.\n\nBeje, mokslininkų tyrimai taip pat atskleidė, kaip nesunkiai vien iš vyro žvilgsnio galima nuspręsti – jis moterimi rimtai domisi, ar tiesiog svajoja su ja permiegoti. Pasirodo, jei vyro žvilgsnis labiausiai koncentruojamas į damos veidą, akis, tai rodo, jog jis ją vertina kaip potencialią partnerę ir jo ketinimai labiau romantiški. Na, o jei akimis narsto kitas moters kūno dalis, tarkime, krūtinę, kojas ar užpakaliuką – tai labiau rodo vien seksualinį geismą.\n\n2. Jis labai nori jus paliesti\n\nNet jei negali sau leisti intymiai liesti jam patinkančios moters, vyras to vis tiek trokšta – visa siela ir kūnu. Ir jei tik nėra ypatingai kuklus, jam pakankamai sudėtinga šį troškimą tramdyti. Jei santykiai su trokštama moterimi draugiški, vyrai neretai visai nesąmoningai pasitelkia taktiką, leidžiančią jiems bent iš dalies patenkinti lietimosi poreikį – žaismingus prisilietimus.\n\nTai lengvi ir spontaniški, greiti ir iš pirmo žvilgsnio nekalti prisilietimai, tarkime, kalbantis ar juokiantis jis greitu judesiu pirštų galiukais perbėga jūsų ranką arba koją, linksmai pliaukšteli per šlaunį prisėdęs greta, nekaltai apkabina per pečius, palydėdamas ar rodydamas kelią paliečia ranką ar nugarą, arba patapšnoja per nugarą einant pro šalį.\n\nO troškimas liesti moters plaukus yra laikomas vienu akivaizdžiausių ženklų, jog vyras jai neabejingas. Tad, jei jis pataiso jums sruogą, žaismingai suvelia ar kitaip žaidžia su jūsų plaukais, galite neabejoti, jūsų nori, nors ir tvardosi, tačiau naudojasi menkiausia proga nekaltai prisiliesti. Įdomu tai, jog šie judesiai abejingam asmeniui gali visai nieko nereikšti, būti beveik nepastebimi, tačiau, jei troškimas abipusis, tokie nekalti prisilietimai stipriai kaitina kraują.\n\nJeigu santykiai nėra tokie draugiški, kad vyras jaustųsi galįs apskritai jus paliesti, jis gali stengtis bent jau būti kuo arčiau, tarkime, atsisėsti greta, kalbantis palinkti arčiau arba pastumti arčiau jūsų savo asmeninius daiktus, pavyzdžiui, gėrimo taurę bare.\n\n3. XXI a. indikatoriai\n\nŠiais laikais, kai išmanieji telefonai, internetas ir socialiniai tinklai stipriai keičia romantikos sampratą, susižavėjusio vyriškos lyties atstovo jausmus neabejotinai išduos ir jo virtualus elgesys (nebent jis senamadis ir neturi net feisbuko paskyros).\n\nSmagu, jog paspaudus vos kelis mygtukus galima nemažai sužinoti apie patinkantį žmogų – juk galima ir pagooglinti, ir panaršyti feisbuko profilį. O jei taip jau nutiko, kad socialiniuose tinkluose tapote draugais, nepamirškite, jog kaip asmuo su jumis bendrauja socialiniuose tinkluose, yra geras jausmų jums indikatorius.\n\nJei priešingos lyties atstovas laikina visus jūsų įrašus ir kiekvieną nuotrauką, panašu, kad jūsų nori (išskyrus atvejus, jei jis laikina visų savo feisbuko draugų visus įrašus). Jei jis beveik kasdien kažką jums parašo arba jei netikėtai gaunate „Labas rytas“ žinutę, galite neabejoti – jumis aktyviai domisi. Juk jei esate vienas pirmųjų žmonių, apie kurį jis pagalvoja ryte, dvelkia rimtumu. Tuo pačiu kvepia ir „Labos nakties“ žinutės arba įprotis kasdien su jumis susirašinėti per pietų pertrauką.\n\nRimtą susidomėjimą rodo ir tai, kad vyras, bendraudamas su jumis gyvai, ignoruoja savo išmanųjį telefoną ir neatrašinėja į jį atakuojančias žinutes. Kita vertus, šis ženklas gali rodyti ir tai, kad šis vyras yra tiesiog mandagus.\n\nVertinant, ar žmogus jums rimtai simpatizuoja, vertėtų dėmesį atkreipti ir į kitus požymius. Susižavėjimo apimtas asmuo neabejotinai siunčia bent keletą ženklų. Tai:\n\n* Sunkiai tvardomas jaudulys, nerimastingumas bendraujant su jumis ar būnant greta – gali būti, kad jis nori padaryti jums gerą įspūdį, tačiau bijo suklysti.\n\n* Pavydas be pagrindo – nors nesate pora, tačiau jis keistai pavydžiai reaguoja, jei flirtuojate su kitais.\n\n* Bendraudamas su jumis dažnai liečia savo veidą, kaklą, galvą, plaukus. Pasak kūno kalbos specialistų, susijaudinusio asmens rankų judesiai kyla aukštyn.\n\n* Jis tampa jūsų veidrodžiu – sėdasi ar stojasi ta pačia poza, nevalingai kopijuoja rankų ir kitus judesius arba jūsų ištartas frazes.\n\nJei nusprendėte, kad jūsų dėmesio objektas jumis taip pat žavisi arba jei vis dar nesate tuo įsitikinusi, visada lieka pats tiesiausias kelias – liautis ieškoti slaptų požymių ir paprasčiausiai užkalbinti jį socialiniuose tinkluose arba užmegzti artimesnį gyvą kontaktą. Paprasčiausia frazė: „Labas, o kaip tau šiandien einasi...“ ir po jos užsimezgęs pokalbis veikiausiai padės suprasti – vis tik dominate jūs jį kaip moteris, ar jo tiesiog tokios (išsprogusios) akys.", "source": "https://www.moteris.lt/lt/psichologija/g-67467-sie-zenklai-rodo-tas-vyras-jumis-domisi"}, {"id": 8, "tag": "Psichologija", "meta": "Moteris.lt · 7 min.", "title": "Ką daryti, jei vyrui – vidurio amžiaus krizė: kaip neprarasti savęs", "summary": "Ne apie tai, kaip pakeisti vyrą ar žūtbūt išsaugoti santykius, o apie tai, kaip šiuo sunkiu laikotarpiu pasirūpinti savimi ir vaikais.", "body": "Jūsiškiui apie 40-50 m. ir jis staiga pajuto didžiulį nepasitenkinimą šeimyniniu gyvenimu bei jumis kaip partnere? Taip pat nenumaldomą nuotykių, adrenalino bei kardinalių gyvenimo pokyčių troškimą?\n\nJis tapo panašesnis į maištaujantį paauglį nei į brandų vyrą ir nebevertina to, kas ilgą laiką buvo svarbu jums abiem – gražių santykių, bendrų namų, laisvalaikio su vaikais, šeimos atostogų, jaukių vakarų namuose... Nepasitaręs priima neracionalius sprendimus, neaišku ko pyksta ir dėl visko kaltina jus? Neretai tokią situaciją vainikuoja išaiškėjęs susižavėjimas kita moterimi ir netgi pareiškimas skirtis!\n\nVidurio amžiaus krizė vyrams gali smogti netikėtai ir labai stipriai. Dėl jos, deja, neretai išyra šeimos ir griūva gyvenimai...\n\nŠis straipsnis skirtas moterims, kurios kraustosi iš proto dėl kardinaliai pasikeitusio ir santykiams labai žalingo savo antrosios pusės elgesio. Tačiau jis ne apie tai, kaip padėti vidurio amžiaus krizės kamuojamam vyrui. Praktika bei psichologų komentarai rodo, jog vargu ar jam šiuo metu apskritai gali kas nors padėti pasijusti laimingu arba įkrėsti proto, nebent pagalbos ieškotų jis pats. Šis straipsnis taip pat nėra apie tai, kaip žūtbūt išsaugoti santykius, išlaikyti lyg nuo grandinės nutrūkusį vyrą ar pačiai išsinerti iš kailio, stengiantis vėl tapti geidžiama ir mylima moterimi. Straipsnis yra apie tai, kaip šiuo sunkiu periodu neišeiti iš proto ir padėti pačiai sau!\n\n## Sako, vieno kalto nebūna...\n\n… Bet būna, kad vienam tiesiog nurauna stogą! Todėl psichologų nuolat kartojama tiesa, jog dėl santykių bėdų kalti abu, vyro vidurio amžiaus krizės įkarštyje gali ir nepadėti. Mūsų visuomenėje moterys ir taip per dažnai kenčia nuo menkos savivertės, yra linkusios prisiimti per daug atsakomybės už santykius ir dėl visko kaltinti save. Tad jei susilaukėte antrosios pusės kaltinimų, jog tapote seksualiai nepatraukli, su jumis neįdomu bendrauti, apskritai esate pati baisiausia ragana, su kuria jis, nelaimingasis, kamuojasi jau kokius 15 metų ir nebegali tverti nė minutės ilgiau... greičiausiai dėl netikėtai užgriuvusių milijono šeimos problemų, kalta visai ne jūsų nebemergaitiška figūra, primestas seksualinis šaltumas ir netgi ne jūsų priekaištai, kurie, pasirodo, jau mirtinai užkamavo vyrą... Visiškai tikėtina, jog santykių problemų jūs turite, kaip, beje, ir visos likusios poros pasaulyje. Tačiau dėl visos tos sumaišties, kurioje jau kuris laikas gyvenate tikriausiai negalima kaltinti nei jūsų, nei nelaimingo, vidinių prieštaravimų kankinamo, vyro. Tai ką kaltinti? Kaltinimai apskritai retai padeda, todėl partnerio vidurio amžiaus krizės įkarštyje verčiau susitelkti į svarbų tikslą – kaip pasijusti geriau!\n\n## Išmintingiems sprendimams reikia laiko\n\nTikriausiai jau kuris laikas neapsakomai pykote ant vyro ir tuo pat metu stengėtės sveiku protu suvokti, paaiškinti jo elgesį bei kontroliuoti to elgesio pasekmes. Veltui bandėte jam įrodinėti seniai aiškias santykių aksiomas – apie būtinybę atsižvelgti į abiejų poreikius, atvirai kalbėtis, išsaugoti pasitikėjimą... Vietoj supratingumo jis tik priversdavo jus pačią pasijusti kalta. Greičiausiai ėmėte graužtis ir save kaltinti dalykais, už kuriuos nesate atsakinga. Taip pat tikėtina, jog, susitelkusi į santykių problemų sprendimą, apleidote savo ir vaikų poreikius. Bergždžios pastangos sutvarkyti suirutę neabejotinai kelia didžiulį nerimą dėl ateities ir netgi depresiją.\n\nDeja, nei viena negimė su begaline išmintimi ir reta kuri yra puikiai pasiruošusi savo antrosios pusės vidurio amžiaus krizei. Paprastai tik praėjus šiek tiek laiko, pražudžius ne vieną nervų ląstelę, išrėkus ir išverkus daug skausmo ir neteisybės, įmanoma į situaciją pažvelgti ramiau, išmintingiau ir suvokti, jog geriausia, ką galima padaryti – pasirūpinti savimi bei vaikais. Svarbu suprasti labai svarbią tiesą – jokie jūsų veiksmai negali apsaugoti vyro nuo šios krizės, tačiau jūs galite ir netgi privalote šį tą padaryti tam, kad apsaugotumėte save ir vaikus nuo gniuždančių jos padarinių. Jei tai suvokėte, vadinasi jau padarėte reikšmingą žingsnį krizės įveikimo link. Ne vyro krizės (su savąja jam teks susitvarkyti pačiam), o savo.\n\n## Sielą gydantys patarimai\n\nAmerikietė santykių ir skyrybų konsultantė Cathy Meyer pataria, kaip elgtis, jei dėl vyro vidurio amžiaus krizės šeimoje situacija tapo nepakeliama, tarkime, jis visiškai ignoruoja jūsų poreikius, akivaizdžiai neketina spręsti iškilusių santykių sunkumų, užmezgė romaną su kita moterimi ar pareiškė norą skirtis.\n\n### Nustatykite griežtas ribas\n\nJei jau šimtus kartų mėginote aiškintis santykius, tačiau jaučiate, jog partneris tarsi negirdi ir toliau elgiasi egoistiškai, patariama nustatyti aiškias ribas – kokį antrosios pusės elgesį toleruosite ir kokio ne. Griežtai laikykitės šių ribų. Neleiskite savęs žeminti, nesileiskite paveikiama, jei sutuoktinis bandys įtikinti, kad tai ne jis, o jūs išsikraustėte iš proto. Apskritai tokioje situacijoje geriau vengti ilgų ir išsunkiančių pokalbių bei diskusijų. Kiek įmanoma ramiau ir su meile pasakykite vyrui, koks elgesys jums yra priimtinas ir koks ne ir ką ketinate daryti, jei jis elgsis jums nepriimtinu būdu.\n\n### Susitelkite į savo, o ne sutuoktinio elgesį\n\nVienas sudėtingiausių uždavinių – stengtis nebegalvoti apie neracionalų ir nesąžiningą vyro elgesį. Tačiau tai padaryti reikia, kad pati neišeitumėte iš proto ir sugebėtumėte toliau gyventi savo gyvenimą. Nekamuokite savęs mintimis apie tai, ką vyras veikia ir su kuo leidžia laiką. Jūs nesate atsakinga už jokio suaugusio asmens elgesį, išskyrus savo. Jei vyro neveikia logiški argumentai, niekaip negalite priversti jo elgtis tinkamai. Neprisiimkite per daug atsakomybės už gražius santykius ir šeimos išlikimą. Už tai esate atsakinga ne jūs viena, o abu. Nesistenkite gintis ir aiškintis, vos sutuoktinis meta jums bet kokius kaltinimus. Sąmoningai ar ne, jis greičiausiai bando jus provokuoti ir priversti teisintis. Nelogiškus kaltinimus geriausia ignoruoti, nesiteisinant, neįrodinėjant, tiesiog atsitraukiant.\n\n### Valdykite savo emocijas\n\nŠi sudėtinga situacija, kad ir kaip nepaguodžiamai tai skambėtų, vis tik yra puiki proga išmokti išreikšti savo emocijas tinkamais, sveikais būdais. Jei viena pusė elgiasi neracionaliai, labai svarbu jog bent antroji išliktų rami ir elgtųsi taip, kaip geriausia jai pačiai bei vaikams. Nekelkite scenų ir negrasinkite, nes taip tik išsekinsite save, išgąsdinsite vaikus ir dar labiau paaštrinsite situaciją. Verčiau pasistenkite visais įmanomais būdais stiprinti pasitikėjimą savimi – paskaitykite rimtesnės psichologinės literatūros apie vidurio amžiaus krizę bei savivertę, išsikalbėkite su jus palaikančiais žmonėmis arba psichologu, stiprinkite save profesinėje ar kitoje jums svarbioje srityje. Jūsų savivertė veikiausiai gerokai nukentėjo dėl antrosios pusės kaltinimų, abejingumo ar lakstymo paskui kitas moteris. Pats metas atgauti tikėjimą savimi.\n\n### Neiškriskite iš gyvenimo\n\nLikite aktyvi, neapribokite savo socialinio gyvenimo, o atvirkščiai – plėskite jo ribas. Išeikite susitikti su draugais bent kartą per savaitę. Sportuokite, užsiimkite savanoriška veikla, veikite tai, kas teikia malonumą ir pripildo jus emociškai bei dvasiškai. Neplanuokite veiklų kartu su sutuoktiniu. Jei savo elgesiu jis rodo, jog nenori elgtis kaip vedęs vyras, nesitikėkite, jog norės dalyvauti šeimos šventėse ar nueiti kartu į kiną... Pasistenkite atsiriboti ir gyventi savo gyvenimą su vaikais taip lyg būtumėte vieniša.\n\n### Išsaugokite pozityvumą\n\nSunku šypsotis, kai asmeninis pasaulis griūna. Tačiau galima susikoncentruoti į kitas gyvenimo sritis ir įvertinti tai, ką turite. Sustokite, apsidairykite, pažvelkite į savo vaikus, jiems reikia jūsų meilės ir dėmesio. Dažniau juos apkabinkite ir pasikalbėkite apie svarbius dalykus jų gyvenime. Atgaivinkite santykius su draugėmis ir prisiminkite žavią mergaitišką draugystę. Dažniau būkite gamtoje, stebėkite jos grožį, nuolatinę kaitą. Nepaisant jūsų vyrą kamuojančios krizės ir visų to pasekmių, gyvenimas nėra vien santykiai su antrąja puse. Aplink yra labai daug gražių dalykų, kuriais galima džiaugtis ir vertinti.\n\n### Palikite jį ramybėje!\n\nJei vyras gyvena atskirai, neskambinkite jam, neinicijuokite pokalbių apie santykių problemas, nesakykite jam, jog vis dar mylite ir pasiilgote, net jeigu tai gryna tiesa. Nereikalaukite dėmesio iš savo vidurio amžiaus krizės kamuojamo vyro. Kuo labiau jis tiki, jog jums jo reikia, jog be jo neišsiversite, tuo lengviau jam nuo jūsų bėgti. Jei su vyru vis dar gyvenate tuose pačiuose namuose, bendraukite mandagiai, tačiau nesistenkite kuo daugiau laiko praleisti kartu, nebent jis prašytų jūsų kompanijos. Kuo mažiau kontakto turėsite su asmeniu, kuris jus emociškai žaloja, tuo geriau jausitės. Jei vyras nesutaria su vaikais, spręsti jų nesutarimus nėra jūsų atsakomybė. Jei bandysite padėti, partneris gali priimti tai, kaip kišimąsi. Vyras dabar greičiausiai ieško mažiausios dingsties su jumis susipykti ir jus kaltinti. Nesuteikite tam dar vienos priežasties.\n\n### Spręskite problemas\n\nGeriausias būdas bandyti spręsti santykių problemas su vidurio amžiaus krizės kamuojamu asmeniu – pasitelkti profesionalų santykių konsultantą. Tačiau labai tikėtina, jog jūsų vyras į tokį pasiūlymą reaguos priešiškai, todėl primygtinai to ir nesiūlykite. Bet jei jis pats rodo iniciatyvą, sutikite. Jaučiant jog nepajėgiate pakelti jus užgriuvusių bėdų, vertėtų nueiti pas psichologą vienai. Partnerio vidurio amžiaus krizė gali sukelti rimtas psichologines problemas ir netgi depresiją. Tad būtina imtis visų priemonių to išvengti.\n\nDėmesio! Jei sutuoktinio sprendimai, turi stiprų neigiamą poveikį jūsų ir jūsų vaikų gyvenimui, finansiniam, o ypač fiziniam saugumui, privalote imtis teisinių ar kitokių veiksmų, kad apsaugotumėte savo ir šeimos emocinę gerovę ir turtą!", "source": "https://www.moteris.lt/lt/psichologija/g-58524-ka-daryti-jei-vyrui-vidurio-amziaus-krize-kaip-neprarasti-saves"}], "contactIntro": "Jei norite pasikalbėti apie bendradarbiavimą, pakviesti parašyti tekstą ar tiesiog pasidalinti mintimis apie straipsnį, rasiu būdą jus išgirsti.", "contactNote": "Atsakau per kelias darbo dienas.", "email": "justina.petraskeviciene@gmail.com", "linkedin": "", "location": "Kaunas, Lietuva", "photo": "nuotrauka"}</script>

    var shown = data.articles.map(function(a,i){ return {a:a,i:i}; }).filter(function(x){ return editing || filter==='visi' || x.a.tag===filter; });
    var cards = shown.map(function(x){
      var a = x.a, i = x.i, p = 'articles.'+i+'.';
      var tagCls = 'tag'+(a.tag==='Sportas'||a.tag==='Kelionės'?' s':'');
      if(editing){
        return '<li><div class="article">'+
          '<div class="meta"><span class="'+tagCls+'">'+esc(a.tag)+'</span>'+ed(p+'meta', a.meta, 'Data · trukmė')+'</div>'+
          ed(p+'title', a.title, 'Pavadinimas', 'h3')+
          ed(p+'summary', a.summary, 'Trumpas aprašymas', 'p')+
          '<div class="tools">'+tagSelect(i)+
          '<a class="btn ghost" style="padding:6px 14px;font-size:.82rem" href="#s-'+a.id+'">Rašyti tekstą</a>'+
          '<button type="button" class="del" data-del="'+i+'">Ištrinti</button></div>'+
          '</div></li>';
      }
      return '<li><a class="article" href="#s-'+a.id+'">'+
        '<div class="meta"><span class="'+tagCls+'">'+esc(a.tag)+'</span>'+esc(a.meta)+'</div>'+
        '<h3>'+esc(a.title)+'</h3><p>'+esc(a.summary)+'</p><span class="more">Skaityti →</span></a></li>';
    }).join('');
    if(editing) cards = '<li><button type="button" class="add" id="add-article" style="width:100%;height:100%">+ Naujas straipsnis</button></li>' + cards;
    if(!shown.length && !editing) cards = '<li class="empty">Šia tema straipsnių dar nėra.</li>';
    var n = editing ? data.articles.length : shown.length;
    return '<div class="sec-head"><div><p class="kicker">'+n+' '+word(n)+'</p><h2 id="str-h">Straipsniai</h2></div>'+
      (editing ? '' : '<div class="filters" role="group" aria-label="Rodyti temą">'+['visi'].concat(TAGS).map(function(t){
        return '<button type="button" data-f="'+t+'" aria-pressed="'+(filter===t)+'">'+(t==='visi'?'Visi':t)+'</button>'; }).join('')+'</div>')+
      '</div><ul class="articles">'+cards+'</ul>'+
      ((editing || data.articlesNote) ? ed('articlesNote', data.articlesNote, 'Pastaba po straipsniais (galite palikti tuščią)', 'p', 'note') : '');
  }
  function fmtBody(text){
    var out = '', list = [];
    function flush(){ if(list.length){ out += '<ul>'+list.join('')+'</ul>'; list = []; } }
    paras(text).forEach(function(t){
      var b = /^[*•\-]\s+(.*)$/s.exec(t);
      if(b){ list.push('<li>'+esc(b[1])+'</li>'); return; }
      flush();
      if(/^###\s+/.test(t)) out += '<h4>'+esc(t.replace(/^###\s+/,''))+'</h4>';
      else if(/^##\s+/.test(t)) out += '<h3>'+esc(t.replace(/^##\s+/,''))+'</h3>';
      else if(/^\d+\.\s+\S/.test(t) && t.length < 90) out += '<h3>'+esc(t)+'</h3>';
      else out += '<p>'+esc(t)+'</p>';
    });
    flush();
    return out;
  }
  function tagSelect(i){
    return '<select data-k="articles.'+i+'.tag" aria-label="Tema">'+TAGS.map(function(t){ return '<option'+(data.articles[i].tag===t?' selected':'')+'>'+t+'</option>'; }).join('')+'</select>';
  }

  function render(){
    var lede = data.lede, fx = data.facts;
    app.className = editing ? 'editing' : '';
    app.innerHTML =
      '<header><div class="in nav"><a class="mark" href="#pradzia">'+(editing ? ed('name', data.name, 'Vardas Pavardė') : nameMark())+'</a>'+
      '<nav aria-label="Pagrindinis meniu"><ul><li><a href="#apie">Apie mane</a></li><li><a href="#straipsniai">Straipsniai</a></li><li><a href="#kontaktai">Kontaktai</a></li></ul></nav></div></header>'+
      '<div class="hero-band" id="pradzia"><div class="in hero"><div>'+
        ed('eyebrow', data.eyebrow, 'Pareigos', 'p', 'eyebrow')+
        '<h1>'+ed('headline', data.headline, 'Antraštė')+' <em>'+ed('headlineAccent', data.headlineAccent, 'paryškinta dalis')+'</em></h1>'+
        ed('lede', lede, 'Įžanga', 'p', 'lede')+
        '<div class="cta"><a class="btn primary" href="#straipsniai">Skaityti straipsnius</a><a class="btn ghost" href="#kontaktai">Susisiekti</a></div>'+
      '</div>'+portraitHTML()+'</div></div>'+
      '<main>'+
      '<section id="apie" aria-labelledby="apie-h"><div class="in about"><div>'+
        '<p class="kicker">Susipažinkime</p><h2 id="apie-h" style="margin-bottom:24px">Apie mane</h2>'+
        ed('aboutLead', data.aboutLead, 'Pagrindinė mintis', 'p', 'lead')+
        (editing ? ed('aboutText', data.aboutText, 'Tekstas apie jus', 'div', '') : paras(data.aboutText).map(function(t){ return '<p>'+esc(t)+'</p>'; }).join(''))+
      '</div><div class="chips">'+fx.map(function(f,i){
        return '<div class="chip"><div class="dot">'+(ICONS[i]||ICONS[2])+'</div><div>'+ed('facts.'+i+'.label', f.label, 'Antraštė', 'b')+ed('facts.'+i+'.value', f.value, 'Tekstas')+'</div></div>';
      }).join('')+'</div></div></section>'+
      '<section id="straipsniai" class="art-band" aria-labelledby="str-h"><div class="in" id="art-in">'+articlesHTML()+'</div></section>'+
      '<section id="kontaktai" aria-labelledby="kont-h"><div class="in"><div class="contact"><div>'+
        '<p class="kicker">Parašykite man</p><h2 id="kont-h" style="margin-bottom:20px">Kontaktai</h2>'+
        ed('contactIntro', data.contactIntro, 'Kvietimas susisiekti', 'p')+ed('contactNote', data.contactNote, 'Pastaba', 'p', 'soft')+
      '</div><ul class="links">'+
        ((editing || data.email) ? '<li><div><span class="k">El. paštas</span>'+ed('email', data.email, 'el. paštas', 'span', 'v')+'</div>'+(editing?'':'<button class="copy" type="button" id="copy-email">Kopijuoti</button>')+'</li>' : '')+
        ((editing || data.linkedin) ? '<li><div><span class="k">LinkedIn</span>'+ed('linkedin', data.linkedin, 'nuoroda (galite palikti tuščią)', 'span', 'v')+'</div></li>' : '')+
        ((editing || data.location) ? '<li><div><span class="k">Vieta</span>'+ed('location', data.location, 'miestas', 'span', 'v')+'</div></li>' : '')+
      '</ul></div></div></section></main>'+
      '<footer><div class="in"><span>© 2026 '+esc(data.name)+'</span><a href="#pradzia">Į viršų ↑</a></div></footer>'+
      editBar();
    if(editing){
      app.querySelectorAll('[data-k]').forEach(function(el){
        if(el.tagName==='TEXTAREA' || el.tagName==='SELECT') return;
        el.setAttribute('contenteditable','plaintext-only');
        if(el.contentEditable !== 'plaintext-only') el.setAttribute('contenteditable','true');
        el.setAttribute('spellcheck','true');
      });
    }
  }
  function portraitHTML(){
    var hasPhoto = /^[A-Za-z0-9_-]+$/.test(data.photo || '');
    var inner = hasPhoto
      ? '<img src="'+PHOTO+'" alt="'+esc(data.name)+'">'
      : '<div>'+ed('initials', data.initials, 'JP', 'span', 'ini')+'<small>'+(editing && assetsApi ? 'Įkelkite savo nuotrauką' : 'Čia bus jūsų nuotrauka')+'</small></div>';
    var tools = '';
    if(editing && assetsApi){
      tools = '<div class="photo-tools">'+
        '<label for="photo-input">'+(uploading ? 'Įkeliama…' : (hasPhoto ? 'Keisti nuotrauką' : 'Įkelti nuotrauką'))+
        '<input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp"'+(uploading?' disabled':'')+'></label>'+
        (hasPhoto && !uploading ? '<button type="button" id="photo-remove">Pašalinti</button>' : '')+
        (photoMsg ? '<span class="pmsg" role="status">'+esc(photoMsg)+'</span>' : '')+
      '</div>';
    }
    return '<div class="photo-wrap"><div class="portrait"'+(hasPhoto?'':' aria-label="Vieta nuotraukai"')+'>'+inner+'</div>'+tools+'</div>';
  }
  function shrink(file){
    return new Promise(function(resolve){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var max = 900, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max/Math.max(w,h));
        var c = document.createElement('canvas'); c.width = Math.round(w*k); c.height = Math.round(h*k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){ resolve(b || file); }, 'image/jpeg', 0.86);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }
  function uploadPhoto(file){
    sync(); uploading = true; photoMsg = ''; render();
    shrink(file).then(function(blob){
      if(!blob){ throw {code:'unreadable'}; }
      return assetsApi.upload(blob, {type: blob.type === 'image/png' || blob.type === 'image/webp' ? blob.type : 'image/jpeg'});
    }).then(function(res){
      data.photo = res.id; uploading = false; photoMsg = 'Nuotrauka įkelta. Nepamirškite paspausti „Išsaugoti“.'; render();
    }, function(err){
      uploading = false;
      var c = err && err.code;
      photoMsg = c === 'unreadable' || c === 'unsupported_type' ? 'Šio failo atidaryti nepavyko. Rinkitės JPG arba PNG nuotrauką.'
        : c === 'too_large' ? 'Nuotrauka per didelė. Rinkitės mažesnę nei 20 MB.'
        : c === 'rate_limited' ? 'Palaukite minutę ir bandykite dar kartą.'
        : 'Nepavyko įkelti nuotraukos. Bandykite dar kartą.';
      render();
    });
  }
  function editBar(){
    if(!canWrite) return '';
    if(!editing) return '<div class="editbar">'+(message?'<span class="msg" role="status">'+esc(message)+'</span>':'')+'<button type="button" class="btn primary" id="edit-on">✎ Redaguoti</button></div>';
    return '<div class="editbar"><span class="msg" role="status">'+esc(message || 'Spauskite ant teksto ir taisykite')+'</span>'+
      '<button type="button" class="btn ghost" id="edit-cancel"'+(busy?' disabled':'')+'>Atšaukti</button>'+
      '<button type="button" class="btn primary" id="edit-save"'+(busy?' disabled':'')+'>'+(busy?'Saugoma…':'Išsaugoti')+'</button></div>';
  }

  function buildDocument(){
    var json = JSON.stringify(saved).replace(/</g,'\\u003c');
    var style = document.querySelector('style:not([data-skeleton])');
    var styles = Array.prototype.filter.call(document.querySelectorAll('style'), function(s){ return s.textContent.indexOf('--display') > -1; });
    var css = styles.length ? styles[0].textContent : (style ? style.textContent : '');
    var font = document.querySelector('link[href*="fonts.googleapis"]');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
      '<title>'+esc(saved.name || 'Asmeninė svetainė')+'</title>\n'+
      '<meta name="claude:viewport-fit-sides" content="cover">\n'+
      (font ? '<link rel="stylesheet" href="'+esc(font.getAttribute('href'))+'">\n' : '')+
      '<style>'+css+'</style>\n<div id="app"></div>\n'+
      '<script type="application/json" id="site-data">'+json+'<\/script>\n'+
      '<script id="app-js">'+document.getElementById('app-js').textContent+'<\/script>\n'+
      '</body></html>';
  }

  function save(){
    sync();
    busy = true; message = ''; render();
    var prev = saved;
    saved = clone(data);
    artifactApi.publish(buildDocument()).then(function(){
      busy = false; editing = false; message = 'Išsaugota'; render();
    }, function(err){
      saved = prev; busy = false;
      var code = err && err.code;
      if(code === 'conflict'){ message = 'Svetainė ką tik pasikeitė kitur, puslapis persikrauna.'; }
      else if(code === 'not_writer' || code === 'not_granted'){ canWrite = false; editing = false; message = ''; data = clone(saved); }
      else if(code === 'rate_limited'){ message = 'Per daug išsaugojimų iš eilės. Palaukite minutę ir bandykite dar kartą.'; }
      else { message = 'Nepavyko išsaugoti. Patikrinkite interneto ryšį ir bandykite dar kartą.'; }
      render();
    });
  }

  app.addEventListener('click', function(e){
    var t = e.target.closest('button, a');
    if(!t) return;
    if(t.dataset.f){ filter = t.dataset.f; render(); return; }
    if(t.id === 'edit-on'){ data = clone(saved); editing = true; message = ''; photoMsg = ''; render(); return; }
    if(t.id === 'edit-cancel'){ data = clone(saved); editing = false; message = ''; render(); return; }
    if(t.id === 'edit-save'){ save(); return; }
    if(t.id === 'add-article'){
      sync();
      var id = data.articles.reduce(function(m,a){ return Math.max(m, a.id); }, 0) + 1;
      data.articles.unshift({id:id, tag:'Darbas', meta:'', title:'', summary:'', body:''});
      render();
      var first = app.querySelector('[data-k="articles.0.title"]'); if(first) first.focus();
      return;
    }
    if(t.id === 'photo-remove'){ sync(); data.photo = ''; photoMsg = ''; render(); return; }
    if(t.dataset.del != null){ sync(); data.articles.splice(+t.dataset.del, 1); render(); return; }
    if(t.id === 'copy-email'){
      var el = app.querySelector('[data-k="email"]');
      var done = function(){ t.textContent='Nukopijuota'; setTimeout(function(){ t.textContent='Kopijuoti'; },1600); };
      var fallback = function(){ var r=document.createRange(); r.selectNodeContents(el); var s=getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent='Pažymėta'; };
      try { navigator.clipboard.writeText(el.textContent).then(done, fallback); } catch(err){ fallback(); }
    }
  });
  app.addEventListener('change', function(e){
    if(e.target.id === 'photo-input' && e.target.files && e.target.files[0]) uploadPhoto(e.target.files[0]);
  });
  app.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.matches && e.target.matches('[data-k]') && e.target.tagName !== 'TEXTAREA' && e.target.dataset.k !== 'aboutText'){ e.preventDefault(); e.target.blur(); }
  });

  var lastWasReader = currentArticle() > -1;
  window.addEventListener('hashchange', function(){
    var isReader = currentArticle() > -1;
    if(isReader || lastWasReader){
      sync();
      var target = location.hash;
      render();
      var el = isReader ? document.getElementById('straipsniai') : (target && document.getElementById(target.slice(1)));
      if(el) el.scrollIntoView();
    }
    lastWasReader = isReader;
  });

  render();

})();
</script>
</body>
</html>
